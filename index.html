
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Praveen Raj M | Resume</title>

    
<style>
    * {
        box-sizing: border-box;
    }

    html {
        background: #151214;
    }

    body {
        max-width: 900px;
        margin: 35px auto;
        padding: 38px 42px;
        background: #211b1f;
        color: #eee4e5;
        font-family: "Segoe UI", Arial, sans-serif;
        line-height: 1.7;
        border: 1px solid #493039;
        border-radius: 16px;
        box-shadow: 0 20px 60px #0008;
    }

    header {
        position: relative;
        padding: 5px 135px 25px 0;
        border-bottom: 2px solid #a64d56;
    }

    h1 {
        margin: 0;
        color: #f3c5a5;
        font-size: clamp(2rem, 5vw, 2.8rem);
        letter-spacing: 1px;
        line-height: 1.3;
    }

    h2 {
        color: #e5a0a8;
        font-size: 1.25rem;
        letter-spacing: 1px;
        margin: 0 0 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid #493039;
    }

    .intro {
        color: #d99579;
        font-size: 16px;
        margin: 8px 0;
    }

    .header-desc {
        color: #c9b9bd;
        font-size: 13px;
        margin: 8px 0;
    }

    .profile-pic {
        position: absolute;
        top: 5px;
        right: 0;
        width: 115px;
        height: 115px;
        object-fit: cover;
        border-radius: 16px;
        border: 2px solid #c17b73;
        box-shadow: 0 0 20px #a64d5633;
    }

    .contact {
        margin-top: 16px;
        font-size: 13px;
        color: #e2d2d5;
    }

    section {
        margin-top: 22px;
        padding: 20px;
        background: #2a2227;
        border: 1px solid #423039;
        border-radius: 10px;
        transition: border-color 0.3s, transform 0.3s;
    }

    section:hover {
        border-color: #a64d56;
        transform: translateY(-2px);
    }

    p {
        margin: 7px 0;
    }

    ul {
        padding-left: 22px;
    }

    li {
        padding: 4px 0;
        color: #d7c8cc;
    }

    .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .skills span {
        padding: 6px 13px;
        color: #f1c3ad;
        background: #38262d;
        border: 1px solid #85505a;
        border-radius: 6px;
        font-size: 13px;
        transition: 0.3s;
    }

    .skills span:hover {
        background: #a64d56;
        color: white;
    }

    .project {
        margin-bottom: 20px;
        padding-left: 14px;
        border-left: 3px solid #bd7968;
    }

    .project strong {
        color: #f0b99e;
    }

    a {
        color: #f0ad98;
        text-decoration: none;
        overflow-wrap: anywhere;
    }

    a:hover {
        color: #ffd7bd;
        text-decoration: underline;
    }

    button {
        margin-top: 24px;
        padding: 12px 25px;
        color: #211b1f;
        background: #e8ad91;
        border: none;
        border-radius: 7px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #f4c6ad;
    }

    @media (max-width: 600px) {
        body {
            margin: 10px;
            padding: 22px 16px;
        }

        header {
            padding-right: 0;
        }

        .profile-pic {
            position: static;
            display: block;
            width: 100px;
            height: 100px;
            margin-bottom: 18px;
        }

        section {
            padding: 15px;
        }
    }

    @page {
        size: A4;
        margin: 12mm;
    }

    @media print {
        html,
        body {
            max-width: none;
            margin: 0;
            padding: 0;
            color: #292929;
            background: white;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }

        header {
            padding-right: 125px;
            border-bottom-color: #a64d56;
        }

        h1 {
            color: #873844;
        }

        h2,
        .intro,
        .project strong {
            color: #873844;
        }

        .header-desc,
        .contact,
        p,
        li {
            color: #333;
        }

        section {
            padding: 14px;
            background: white;
            border: 1px solid #ddd;
            break-inside: avoid;
            transform: none;
        }

        .skills span {
            color: #873844;
            background: white;
            border-color: #a64d56;
        }

        a {
            color: #873844;
        }

        button {
            display: none;
        }
    }
</style>

</head>

<body>

    <header>
        <img
            id="profileImage"
            class="profile-pic"
            src="image.jpg"
            alt="Profile Photo"
        >

        <h1 id="name"></h1>

        <h3 class="intro" id="role"></h3>

        <p class="header-desc" id="tagline"></p>

        <p class="header-desc" id="introText"></p>

        <div class="contact">
            <p>
                Email:
                <a id="emailLink"></a>
            </p>

            <p>
                Phone:
                <span id="phone"></span>
            </p>

            <p>
                Location:
                <span id="location"></span>
            </p>
        </div>
    </header>

    <main>

        <section>
            <h2>Profile</h2>
            <p id="profile"></p>
        </section>

        <section>
            <h2>Education</h2>
            <div id="education"></div>
        </section>

        <section>
            <h2>Technical Skills</h2>
            <div class="skills" id="skills"></div>
        </section>

        <section>
            <h2>Projects</h2>
            <div id="projects"></div>
        </section>

        <section>
            <h2>Certifications</h2>
            <ul id="certifications"></ul>
        </section>

        <section>
            <h2>Personal Strengths</h2>
            <ul id="strengths"></ul>
        </section>

        <section>
            <h2>Contact</h2>

            <p>
                Email:
                <a id="contactEmail"></a>
            </p>

            <p>
                Phone:
                <span id="contactPhone"></span>
            </p>
        </section>

    </main>

    <script>
        
        document.getElementById("name").textContent =
            "PRAVEEN RAJ M";

        document.getElementById("role").textContent =
            "Computer Science Student";

        document.getElementById("tagline").textContent =
            "Interested in Software Development and Web Technologies";

        document.getElementById("introText").textContent =
            "Motivated student passionate about developing useful applications, learning new technologies and solving real-world problems.";

        document.getElementById("profileImage").src =
            "image.jpg";

        
        document.getElementById("profile").textContent =
            "Enthusiastic Computer Science student interested in software development, web technologies and problem-solving.";

        
        document.getElementById("emailLink").textContent =
            "praveen323747@gmail.com";

        document.getElementById("emailLink").href =
            "mailto:praveen323747@gmail.com";

        document.getElementById("phone").textContent =
            "+91 93457558999";

        document.getElementById("location").textContent =
            "Chennai, India";

        document.getElementById("contactEmail").textContent =
            "praveen323747@gmail.com";

        document.getElementById("contactEmail").href =
            "mailto:praveen323747@gmail.com";

        document.getElementById("contactPhone").textContent =
            "+91 93457558999";

        
        document.getElementById("education").innerHTML = `
            <p><b>Bachelor's Degree in Computer Science</b></p>
            <p>SA Engineering College, Chennai</p>
            <p>2023–2027</p>
            <p>CGPA: 7.90</p>
        `;

        
        const skills = [
            "Python",
            "Java",
            "C",
            "HTML",
            "CSS"
        ];

        skills.forEach(function(skill) {
            let span = document.createElement("span");

            span.textContent = skill;

            document.getElementById("skills").appendChild(span);
        });

        
        const projects = [
            [
                "OmniFlow – AI Workflow Automation Platform",
                "Automates repetitive tasks by connecting applications through triggers and actions.",
                "Python, FastAPI, React, MongoDB, APIs"
            ],
            [
                "LuxBus – Premium Bus Booking Website",
                "Responsive bus booking website with a modern user interface.",
                "HTML, CSS, JavaScript"
            ]
        ];

        projects.forEach(function(project) {
            let div = document.createElement("div");
            div.className = "project";

            let title = document.createElement("strong");
            title.textContent = project[0];

            let description = document.createElement("p");
            description.textContent = project[1];

            let technology = document.createElement("p");
            technology.textContent = "Technologies: " + project[2];

            div.appendChild(title);
            div.appendChild(description);
            div.appendChild(technology);

            document.getElementById("projects").appendChild(div);
        });

        
        const certifications = [
            "UI/UX Design",
            "Web Development"
        ];

        certifications.forEach(function(certificate) {
            let li = document.createElement("li");

            li.textContent = certificate;

            document.getElementById("certifications").appendChild(li);
        });

        
        const strengths = [
            "Quick Learning and Adaptability",
            "Teamwork and Collaboration",
            "Problem-Solving Skills",
            "Willingness to Learn"
        ];

        strengths.forEach(function(strength) {
            let li = document.createElement("li");

            li.textContent = strength;

            document.getElementById("strengths").appendChild(li);
        });
    </script>

</body>
</html>
