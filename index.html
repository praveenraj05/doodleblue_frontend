
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Praveen Raj M | Resume</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 900px;
            margin: auto;
            padding: 32px 20px;
            background: #f5f5f5;
            color: #292929;
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            position: relative;
            padding: 0 130px 24px 0;
            border-bottom: 3px solid #c62828;
        }

        h1, h2 {
            color: #b71c1c;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 5vw, 2.8rem);
            line-height: 1.2;
        }

        .intro {
            color: #c62828;
            margin: 10px 0;
        }

        .header-desc {
            color: #555;
            margin: 8px 0;
        }

        .profile-pic {
            position: absolute;
            top: 0;
            right: 0;
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
        }

        .contact {
            margin-top: 14px;
            font-size: 13px;
        }

        section {
            padding: 20px 0;
            border-bottom: 1px solid #ddd;
        }

        h2 {
            font-size: 1.3rem;
            margin: 0 0 10px;
            border-bottom: 1px solid #e4b5b5;
            padding-bottom: 5px;
        }

        p {
            margin: 6px 0;
        }

        ul {
            padding-left: 22px;
        }

        li {
            padding: 3px 0;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skills span {
            border: 1px solid #c62828;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 13px;
        }

        .project {
            margin-bottom: 16px;
        }

        .project strong {
            color: #a51d1d;
        }

        a {
            color: #b71c1c;
            text-decoration: none;
            overflow-wrap: anywhere;
        }

        button {
            background: #c62828;
            color: white;
            padding: 12px 24px;
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 16px;
            }

            header {
                padding-right: 0;
            }

            .profile-pic {
                position: static;
                width: 100px;
                height: 100px;
                margin-bottom: 12px;
            }
        }

        @page {
            size: A4;
            margin: 12mm;
        }

        @media print {
            body {
                padding: 0;
                background: white;
            }

            button {
                display: none;
            }

            section,
            .project {
                break-inside: avoid;
            }
        }
    </style>
</head>

<body>

    <header>
        <img
            id="profileImage"
            class="profile-pic"
            src="image.jpg"
            alt="Profile Photo"
        >

        <h1 id="name"></h1>

        <h3 class="intro" id="role"></h3>

        <p class="header-desc" id="tagline"></p>

        <p class="header-desc" id="introText"></p>

        <div class="contact">
            <p>
                Email:
                <a id="emailLink"></a>
            </p>

            <p>
                Phone:
                <span id="phone"></span>
            </p>

            <p>
                Location:
                <span id="location"></span>
            </p>
        </div>
    </header>

    <main>

        <section>
            <h2>Profile</h2>
            <p id="profile"></p>
        </section>

        <section>
            <h2>Education</h2>
            <div id="education"></div>
        </section>

        <section>
            <h2>Technical Skills</h2>
            <div class="skills" id="skills"></div>
        </section>

        <section>
            <h2>Projects</h2>
            <div id="projects"></div>
        </section>

        <section>
            <h2>Certifications</h2>
            <ul id="certifications"></ul>
        </section>

        <section>
            <h2>Personal Strengths</h2>
            <ul id="strengths"></ul>
        </section>

        <section>
            <h2>Contact</h2>

            <p>
                Email:
                <a id="contactEmail"></a>
            </p>

            <p>
                Phone:
                <span id="contactPhone"></span>
            </p>
        </section>

    </main>

    <script>
        
        document.getElementById("name").textContent =
            "PRAVEEN RAJ M";

        document.getElementById("role").textContent =
            "Computer Science Student";

        document.getElementById("tagline").textContent =
            "Interested in Software Development and Web Technologies";

        document.getElementById("introText").textContent =
            "Motivated student passionate about developing useful applications, learning new technologies and solving real-world problems.";

        document.getElementById("profileImage").src =
            "image.jpg";

        
        document.getElementById("profile").textContent =
            "Enthusiastic Computer Science student interested in software development, web technologies and problem-solving.";

        
        document.getElementById("emailLink").textContent =
            "praveen323747@gmail.com";

        document.getElementById("emailLink").href =
            "mailto:praveen323747@gmail.com";

        document.getElementById("phone").textContent =
            "+91 93457558999";

        document.getElementById("location").textContent =
            "Chennai, India";

        document.getElementById("contactEmail").textContent =
            "praveen323747@gmail.com";

        document.getElementById("contactEmail").href =
            "mailto:praveen323747@gmail.com";

        document.getElementById("contactPhone").textContent =
            "+91 93457558999";

        
        document.getElementById("education").innerHTML = `
            <p><b>Bachelor's Degree in Computer Science</b></p>
            <p>SA Engineering College, Chennai</p>
            <p>2023–2027</p>
            <p>CGPA: 7.90</p>
        `;

        
        const skills = [
            "Python",
            "Java",
            "C",
            "HTML",
            "CSS"
        ];

        skills.forEach(function(skill) {
            let span = document.createElement("span");

            span.textContent = skill;

            document.getElementById("skills").appendChild(span);
        });

        
        const projects = [
            [
                "OmniFlow – AI Workflow Automation Platform",
                "Automates repetitive tasks by connecting applications through triggers and actions.",
                "Python, FastAPI, React, MongoDB, APIs"
            ],
            [
                "LuxBus – Premium Bus Booking Website",
                "Responsive bus booking website with a modern user interface.",
                "HTML, CSS, JavaScript"
            ]
        ];

        projects.forEach(function(project) {
            let div = document.createElement("div");
            div.className = "project";

            let title = document.createElement("strong");
            title.textContent = project[0];

            let description = document.createElement("p");
            description.textContent = project[1];

            let technology = document.createElement("p");
            technology.textContent = "Technologies: " + project[2];

            div.appendChild(title);
            div.appendChild(description);
            div.appendChild(technology);

            document.getElementById("projects").appendChild(div);
        });

        
        const certifications = [
            "UI/UX Design",
            "Web Development"
        ];

        certifications.forEach(function(certificate) {
            let li = document.createElement("li");

            li.textContent = certificate;

            document.getElementById("certifications").appendChild(li);
        });

        
        const strengths = [
            "Quick Learning and Adaptability",
            "Teamwork and Collaboration",
            "Problem-Solving Skills",
            "Willingness to Learn"
        ];

        strengths.forEach(function(strength) {
            let li = document.createElement("li");

            li.textContent = strength;

            document.getElementById("strengths").appendChild(li);
        });
    </script>

</body>
</html>
